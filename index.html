<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf6f2"><title>测你心里的 Ta，对你到底是什么感觉？</title><style>
:root{--ink:#493d41;--muted:#897a7c;--rose:#c88789;--pink:#f2dddd;--cream:#fbf6f2;--card:#fffdfb;--line:#efe5e1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 5%,#f7e8e4,transparent 43%),radial-gradient(ellipse at 90% 90%,#eee9ef,transparent 42%),var(--cream);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100svh}.shell{max-width:720px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.brand{letter-spacing:.16em}.pill{border:1px solid var(--line);padding:4px 12px;border-radius:99px;background:#ffffff99}.screen{display:none;animation:fade .35s ease}.screen.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.hero{text-align:center;padding:clamp(55px,13vh,110px) 8px 40px}.moon{width:96px;height:96px;border-radius:50%;margin:0 auto 26px;background:linear-gradient(140deg,#f6dfdf,#d7c9d6);display:grid;place-items:center;font-size:42px;box-shadow:0 18px 50px #c6959530}.eyebrow{color:var(--rose);font-size:12px;letter-spacing:.22em;text-transform:uppercase}h1{font-size:clamp(31px,7vw,48px);line-height:1.3;margin:14px auto;max-width:560px;letter-spacing:.02em}.subtitle{color:var(--muted);max-width:430px;margin:18px auto 30px}.note{font-size:12px;color:#a29697;margin-top:18px}.btn{border:0;background:var(--ink);color:white;border-radius:99px;padding:14px 30px;font-size:15px;cursor:pointer;box-shadow:0 8px 22px #493d4122;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px #493d4130}.btn.light{background:#f2e5e3;color:var(--ink);box-shadow:none}.quiz{padding-top:42px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}.track{height:5px;background:#eee5e2;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#c88789,#d6aeb0);transition:width .3s}.qnum{margin:38px 0 8px;color:var(--rose);font-size:13px;letter-spacing:.1em}.question{font-size:24px;line-height:1.5;margin:0 0 24px}.options{display:grid;gap:12px}.option{width:100%;text-align:left;padding:15px 17px;border:1px solid var(--line);border-radius:17px;background:#fffdfb;color:var(--ink);font:inherit;cursor:pointer;transition:.2s;display:flex;gap:13px;align-items:flex-start}.option:hover{border-color:#d3a3a4;transform:translateY(-1px)}.option.selected{border-color:var(--rose);background:#fbefef;box-shadow:0 0 0 2px #c8878918}.letter{flex:0 0 28px;height:28px;border-radius:50%;background:#f4e9e7;display:grid;place-items:center;color:#a56d70;font-size:13px;font-weight:600}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px}.nav .btn{padding:11px 23px}.nav .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.result{padding:50px 0 10px;text-align:center}.result-card{margin:24px auto;background:#fffdfb;border:1px solid var(--line);border-radius:26px;padding:30px 24px;box-shadow:0 18px 55px #493d410c;text-align:left}.result-card h2{text-align:center;font-size:34px;margin:12px 0 4px}.animal{text-align:center;color:var(--rose);letter-spacing:.12em;font-size:13px}.desc{color:#65585b;font-size:16px;line-height:2;margin-top:22px}.advice{background:#fbf2f0;border-radius:16px;padding:15px 17px;margin-top:18px;color:#785d60}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer{text-align:center;color:#aa9c9d;font-size:12px;margin-top:28px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#493d41;color:white;border-radius:99px;padding:9px 18px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}@media(min-width:600px){.shell{padding-top:32px}.quiz{padding:56px 24px 0}.result{padding-top:70px}}
</style></head><body><main class="shell"><header class="top"><span class="brand">心事放映室</span><span class="pill">轻松情感测试 · ¥0.99</span></header><section id="cover" class="screen active"><div class="hero"><div class="moon">♡</div><div class="eyebrow">A little feeling test</div><h1>测你心里的 Ta<br>对你到底是什么感觉？</h1><p class="subtitle">凭第一直觉选答案，别替 Ta 找理由。16 个日常小瞬间，看看你们之间的心动、试探和距离，正停在哪里。</p><button class="btn" onclick="start()">开始测试 <span aria-hidden="true">→</span></button><p class="note">16 道题 · 约 3 分钟 · 结果仅供娱乐与自我观察</p></div></section><section id="quiz" class="screen quiz"><div class="progress-head"><span id="count">第 1 / 16 题</span><span id="pct">6%</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="qnum" id="qnum"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="nav"><button class="btn light" id="prev" onclick="move(-1)">← 上一题</button><button class="btn" id="next" onclick="move(1)">下一题 →</button></div></section><section id="result" class="screen result"><div class="eyebrow">你的关系气象报告</div><div class="result-card"><div class="animal" id="animal"></div><h2 id="name"></h2><div class="desc" id="desc"></div><div class="advice" id="advice"></div></div><div class="actions"><button class="btn light" onclick="restart()">↻ 重新测试</button><button class="btn" onclick="share()">分享给朋友 ♡</button></div><p class="footer">结果来自你的选择，仅供娱乐；真实心意仍值得坦诚交流。</p></section><div class="footer">把心动留给真实相处，也留一点空间给自己。</div></main><div id="toast" class="toast">已复制分享文案</div><script>
const Q=[
['深夜你发了一条“今天有点累”，Ta 会怎么回应？',['隔一阵回个表情，话题很快结束','问一句“怎么啦”，听你说几句','陪你聊一会儿，还记得问后来怎么样','立刻打来电话，想知道你是不是一个人']],
['你们走在一起，路过一间很可爱的店，Ta 会……',['自己看两眼，继续往前走','随口问你要不要进去看看','记得你喜欢什么，主动带你进去','说“下次带你来”，顺手把它记进计划']],
['Ta 回复消息的节奏，最像哪一种？',['想起来才回，内容也比较简短','通常会回，但有时一忙就断掉','不一定秒回，却会认真接住你的话','常主动找你，话题结束了也会再续上']],
['聊到周末安排时，Ta 通常会……',['说自己有事，没再多聊','看情况，有空再说','问你想去哪儿，试着约个时间','直接定下时间地点，还问你想吃什么']],
['你换了发型或穿了新衣服，Ta 会？',['好像没注意到','看出来了，简单夸一句','夸得很具体，还记得你之前的样子','盯着看了好一会儿，笑着说很适合你']],
['一群人聊天时，Ta 的目光最常落在哪里？',['谁在说话就看谁，没什么特别','偶尔会看向你','你说话时，Ta 会很专注地听','你一笑，Ta 也会跟着看过来']],
['你们分别后，Ta 最可能发什么？',['没有后续消息','“到家了吗？”','“今天挺开心的，下次再约”','还没到家就发消息，继续聊刚才的小事']],
['Ta 会记得你随口提过的事吗？',['不太记得，除非你再说一遍','记得一两件比较明显的事','能记住你的喜好和最近在忙什么','连你随口说的小愿望，都找机会替你实现']],
['你们单独相处时，气氛通常是？',['礼貌但有点客气，常要找话题','慢慢放松下来，偶尔有点安静','聊得自然，时间过得很快','靠近时会有一点心跳，分别时还舍不得走']],
['Ta 会主动分享自己的生活吗？',['很少，大多是你在问','偶尔分享一张照片或一件小事','会主动讲今天发生的事，也问你的近况','遇到开心或烦心的事，第一个想到找你']],
['你和别人聊得很开心时，Ta 会？',['没什么反应','看一眼，之后照常聊天','会找机会加入你们的话题','有点在意，散场后还会问你们聊了什么']],
['Ta 对你说过的话，哪句最像？',['“有空再说吧。”','“你最近怎么样？”','“这件事我想听你讲。”','“看到这个就想到你了。”']],
['你们聊天突然停住时，通常是谁重新开启话题？',['大多是你','有时你，有时 Ta','Ta 常会隔一会儿主动找你','Ta 会把没聊完的话题接回来，还顺手分享新发现']],
['你临时遇到一点小麻烦，Ta 会？',['说声“注意安全”，让你自己处理','问问情况，给你一个建议','主动帮忙，确认事情有没有解决','先赶来或陪你处理，之后还惦记着问结果']],
['你们之间有没有只有彼此懂的小默契？',['暂时没有，聊天内容都比较普通','偶尔有个共同梗','有些表情或话题，一出现就知道对方在想什么','一个眼神、一句没说完的话，都能让对方接下去']],
['如果你稍微向 Ta 靠近一点，你觉得 Ta 会？',['礼貌回应，但大概维持原来的距离','接住你的话，不过还会观察一阵','明显开心，也会主动向你靠近','像等这一步很久了，顺势把邀约和关系都说得更明白']]
];
const R=[
['微光型','萤火','Ta 对你有基本好感和善意，但目前投入不多，更多还停留在普通熟悉或轻松聊天。你们的关系像一盏刚亮起的小灯，有一点温度，却还没照出明确方向。接下来是否靠近，要看 Ta 会不会主动创造相处机会。先别急着替沉默写答案，试着分享一件具体的小事，看看 Ta 是否愿意接住并继续聊下去。','建议：分享一件具体的小事，看看 Ta 是否愿意接住并继续聊下去。'],
['慢热者','猫咪','Ta 对你并非无感，只是表达偏克制，可能还在熟悉彼此的节奏。关系处在从普通相处往亲近挪动的阶段，偶尔的关心是真的，但还需要更多稳定互动来确认。之后若你们能持续有来有往，距离会慢慢缩短。可以找一个轻松理由约 Ta 一起喝杯东西，给彼此一点自然相处的时间。','建议：找个轻松理由约 Ta 喝杯东西，自然相处看看。'],
['试探型','狐狸','Ta 对你有好奇，也享受你们之间若有似无的暧昧，但似乎还没有把心意摊开。你们像站在一扇半开的门前，谁都在等对方先给一点信号。接下来关系有升温机会，也可能继续停在猜测里。下次聊天时，不妨把“改天”说成一个具体日期，观察 Ta 是否愿意认真赴约。','建议：把“改天”说成一个具体日期，看看 Ta 是否赴约。'],
['偏爱者','小鹿','Ta 对你有明显的关注和偏爱，会留心你的情绪、记住你说过的话，也愿意把时间分给你。现在的关系已经超出泛泛之交，但可能还缺一句明确表达。接下来若互动保持稳定，暧昧很可能自然变得更清楚。挑个舒服的时机，告诉 Ta：“和你单独待着，我总觉得时间过得很快。”','建议：找个舒服的时机，告诉 Ta 和你独处时的真实感受。'],
['心动型','海豚','Ta 很可能已经对你心动，和你相处时会格外投入，也会把小事记在心上。你们之间的亲近感正在增加，只是还需要一次真实的沟通，把默契变成明确的选择。后续发展偏向升温，前提是两个人都愿意迈一步。找个轻松的约会机会，直接问 Ta：“下次我们还可以单独出来吗？”','建议：发出一次清晰、轻松的单独邀约。'],
['牵挂者','小熊','Ta 对你的在意已经落在行动里：会惦记你的近况，也愿意在你需要时出现。你们像是彼此生活里的固定坐标，只差把这种亲近认真说出来。接下来关系有机会从暧昧走向更稳定的陪伴。你可以坦诚表达自己的感受，同时留意 Ta 是否也愿意持续回应，而不只在某个瞬间热情。','建议：坦诚说出感受，也留心 Ta 是否持续回应。'],
['候鸟型','候鸟','Ta 对你有浓浓的好感，靠近时真诚又热烈；若偶尔显得忽远忽近，可能是节奏还没对齐。你们已有很强的熟悉感，未来能否稳定下来，取决于彼此是否愿意把时间安排和期待说清楚。别只看某次特别浪漫的瞬间，留心日常里的持续行动。可以约 Ta 谈谈，你们希望怎样相处。','建议：聊聊彼此希望怎样相处，看看节奏能否对齐。'],
['双向奔赴型','天鹅','Ta 对你的喜欢大概率已经藏不住：会主动靠近、认真回应，也愿意把你放进自己的计划。你们的关系像是已经走到告白前的那一步，之后有机会更明确、更稳定。测试不能替 Ta 表达心意，但你可以给真实交流一个入口。找个只有你们的时刻，轻轻问一句：“你有没有想过，我们现在算什么？”','建议：找个只有你们的时刻，轻轻聊聊关系的定义。']
];
let idx=0,ans=Array(16).fill(null);function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}function start(){idx=0;show('quiz');render()}function render(){let q=Q[idx];document.getElementById('count').textContent=`第 ${idx+1} / 16 题`;document.getElementById('pct').textContent=`${Math.round((idx+1)/16*100)}%`;document.getElementById('fill').style.width=`${(idx+1)/16*100}%`;document.getElementById('qnum').textContent=`QUESTION ${String(idx+1).padStart(2,'0')}`;document.getElementById('question').textContent=q[0];document.getElementById('options').innerHTML=q[1].map((x,i)=>`<button class="option ${ans[idx]===i?'selected':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${x}</span></button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===15?'查看我的结果 →':'下一题 →';document.getElementById('next').disabled=ans[idx]===null}function choose(i){ans[idx]=i;render();if(idx<15)setTimeout(()=>move(1),220);else setTimeout(result,220)}function move(d){if(d===1&&ans[idx]===null)return;if(idx===15&&d===1){result();return}idx=Math.max(0,Math.min(15,idx+d));render()}function result(){let score=ans.reduce((s,x)=>s+x+1,0),r=R[Math.min(7,Math.floor((score-16)/6))];document.getElementById('name').textContent=r[0];document.getElementById('animal').textContent=`✦ ${r[1]}意象 · ${score} 分 ✦`;document.getElementById('desc').textContent=r[2];document.getElementById('advice').textContent=r[3];show('result')}function restart(){ans=Array(16).fill(null);idx=0;show('cover')}async function share(){let text=`我测了测心里的 Ta 对我是什么感觉，结果是「${document.getElementById('name').textContent}」！你也来测测看～`;try{if(navigator.share)await navigator.share({title:'测你心里的 Ta，对你到底是什么感觉？',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);toast()}}catch(e){if(e.name!=='AbortError')toast()}}function toast(){let t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script></body></html>
