<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f0"><title>测一测你的财运到底怎么样</title><style>
:root{--ink:#343d38;--muted:#78827a;--green:#718b72;--lime:#e7eddc;--cream:#f7f7f0;--card:#fffefa;--line:#e6e9df;--gold:#c89c58}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 5%,#edf1e4,transparent 42%),radial-gradient(ellipse at 95% 90%,#f2ecdc,transparent 42%),var(--cream);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100svh}.shell{max-width:720px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.brand{letter-spacing:.15em}.pill{border:1px solid var(--line);padding:4px 12px;border-radius:99px;background:#ffffff99}.screen{display:none;animation:fade .3s ease}.screen.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.hero{text-align:center;padding:clamp(48px,12vh,100px) 8px 38px}.coin{width:96px;height:96px;border-radius:50%;margin:0 auto 24px;background:linear-gradient(145deg,#e9eddd,#d8dfc9);display:grid;place-items:center;font-size:43px;color:#87966b;box-shadow:0 16px 45px #78906422}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.2em;text-transform:uppercase}h1{font-size:clamp(31px,7vw,46px);line-height:1.32;margin:14px auto;max-width:550px}.subtitle{color:var(--muted);max-width:445px;margin:18px auto 28px}.note{font-size:12px;color:#9aa198;margin-top:17px}.btn{border:0;background:var(--green);color:white;border-radius:99px;padding:13px 29px;font-size:15px;cursor:pointer;box-shadow:0 8px 22px #718b7225;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.light{background:#e9eddf;color:var(--ink);box-shadow:none}.quiz{padding-top:38px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:10px}.track{height:5px;background:#e6e9df;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#829777,#c4b37c);transition:width .3s}.qnum{margin:35px 0 7px;color:var(--green);font-size:13px;letter-spacing:.12em}.question{font-size:24px;line-height:1.5;margin:0 0 22px}.options{display:grid;gap:11px}.option{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fffefa;color:var(--ink);font:inherit;cursor:pointer;transition:.2s;display:flex;gap:12px;align-items:flex-start}.option:hover{border-color:#9db08f;transform:translateY(-1px)}.option.selected{border-color:var(--green);background:#f0f3e9}.letter{flex:0 0 28px;height:28px;border-radius:50%;background:#edf0e5;display:grid;place-items:center;color:#637c61;font-size:13px;font-weight:600}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.nav .btn{padding:10px 22px}.nav .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}.result{padding:45px 0 10px;text-align:center}.result-card{margin:22px auto;background:#fffefa;border:1px solid var(--line);border-radius:24px;padding:28px 23px;box-shadow:0 18px 50px #4b55450b;text-align:left}.result-card h2{text-align:center;font-size:34px;margin:10px 0 2px}.tag{text-align:center;color:var(--gold);letter-spacing:.12em;font-size:13px}.desc{color:#566158;font-size:16px;line-height:2;margin-top:22px}.advice{background:#f0f3e9;border-radius:15px;padding:14px 16px;margin-top:17px;color:#52634f}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer{text-align:center;color:#9aa198;font-size:12px;margin-top:26px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#343d38;color:#fff;border-radius:99px;padding:9px 18px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(min-width:600px){.shell{padding-top:30px}.quiz{padding:50px 22px 0}.result{padding-top:60px}}
</style></head><body><main class="shell"><header class="top"><span class="brand">日常小财运</span><span class="pill">轻松习惯测试 · ¥0.99</span></header><section id="cover" class="screen active"><div class="hero"><div class="coin">✦</div><div class="eyebrow">A little money habit quiz</div><h1>测一测你的财运<br>到底怎么样</h1><p class="subtitle">凭第一直觉选答案，看看你的财运藏着什么秘密。16 个生活小场景，测测你如何花钱、抓机会，也看看下一步可以从哪里开始。</p><button class="btn" onclick="start()">开始测试　→</button><p class="note">16 道题 · 约 3 分钟 · 结果仅供娱乐和自我观察</p></div></section><section id="quiz" class="screen quiz"><div class="progress-head"><span id="count">第 1 / 16 题</span><span id="pct">6%</span></div><div class="track"><div class="fill" id="fill"></div></div><div class="qnum" id="qnum"></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="nav"><button class="btn light" id="prev" onclick="move(-1)">← 上一题</button><button class="btn" id="next" onclick="move(1)">下一题 →</button></div></section><section id="result" class="screen result"><div class="eyebrow">你的日常财富画像</div><div class="result-card"><div class="tag" id="tag"></div><h2 id="name"></h2><div class="desc" id="desc"></div><div class="advice" id="advice"></div></div><div class="actions"><button class="btn light" onclick="restart()">↻ 重新测试</button><button class="btn" onclick="share()">分享给朋友 ♡</button></div><p class="footer">本测试不预测收益，不构成理财或投资建议；现实财务决定请结合自身情况谨慎判断。</p></section><div class="footer">把钱花在值得的地方，也给未来留一点余地。</div></main><div id="toast" class="toast">分享文案已复制</div><script>
const Q=[
['发工资的那天，你通常会先做什么？',['先犒劳自己，月底再看剩多少','把固定账单处理好，剩下的照常安排','先留一笔备用，其余再分配','先盘一遍本月目标和存款进度']],
['逛超市时看到“第二件半价”，你会？',['觉得划算就拿，回家再想怎么用','看看是不是本来就需要','算算单价和保质期，再决定','和清单对照，不在计划里的先不买']],
['朋友推荐一个看起来不错的副业机会，你会？',['听着心动，立刻想试试看','问清楚要做什么、花多少时间','先查口碑和规则，小范围试水','先评估自己能提供什么，再决定要不要投入']],
['手机账单提醒你这个月花超了，你会？',['有点心虚，先不细看','看看是哪几项多了，下月注意','分类记下来，找一个最容易调整的地方','回看计划和实际差距，重新安排预算']],
['同事分享一个赚钱点子，你更像？',['马上跟上，怕错过机会','先听完整，再问具体怎么做','找几个可信来源核实，再决定','想清楚回报、成本和退出方式，设好试验范围']],
['买大件前，你通常会？',['喜欢就下单，之后再慢慢适应','比较几家，选评价不错的','先等一天，确认确实需要','设预算、看使用频率，并留好应急余量']],
['突然收到一笔额外收入，你会怎么安排？',['买件惦记很久的东西','先补上近期需要，再留一点','分成储蓄、日常和小奖励','按目标分配，也留一部分给学习或工具']],
['朋友约你做一个新项目，时间紧但听起来有意思，你会？',['先答应再说，边做边看','问清任务和时间，再决定','从小部分开始，确认合拍再加码','先对齐目标、分工和停止条件，再安排时间']],
['你发现自己常买了却没怎么用的东西，会？',['下次提醒自己，但常常忘','先列清单，买前多想一下','找出触发消费的场景，改用等待一天','做月度复盘，调整习惯和预算上限']],
['谈到加薪或报价，你更倾向于？',['觉得不好意思，等对方主动提','准备好工作内容和成果再沟通','整理贡献与市场情况，约时间谈','明确自己的价值、目标和可协商范围，主动开口']],
['如果想增加收入，你第一步会做什么？',['多接点活，先忙起来','看看现有技能能否多用一次','找一个需求明确的小项目试试','盘点能力、时间和需求，设计可持续的小实验']],
['看到限时优惠倒计时，你会？',['怕错过，先抢下来','确认商品适合自己再买','离开页面一会儿，冷静后再看','比较真实价格和用途，优惠不改变原计划']],
['你对“存钱”这件事的感觉是？',['想起来存一点，遇到想买的就取','每月尽量留下一些','先存后花，金额按情况调整','设定目标和自动转存，也留出弹性空间']],
['朋友想和你合伙做点小生意，你会？',['关系好就一起试试','先聊清楚各自负责什么','把成本、分工和退出方式写明白','先做小规模验证，约定复盘节点与边界']],
['面对一个有风险但可能有收获的机会，你通常？',['凭感觉冲一下，机会难得','先问问熟悉的人怎么看','把最坏情况想清楚，再决定能否承受','设定投入上限和观察期限，结果不合适就及时调整']],
['一年后的财务状态，你最希望看到什么变化？',['能少一些冲动消费','有一笔更安心的备用金','收入来源或技能多一条路','目标清晰，储蓄、增收和生活开支更平衡']]
];
const R=[
['快乐买单型','现金流','你的财运现状更受心情和当下选择影响，赚钱时愿意尝试，花钱也容易被新鲜感带走。优势是行动快、懂得奖励自己；短板是钱的去向不够清楚。接下来只要建立一点点规律，手头的稳定感就会提升。给自己设一个每周可自由支配的额度，花完就等下周。','增收建议：每周记一次大额支出，先从看清钱去哪儿开始。'],
['闷声攒钱型','安全垫','你对钱有踏实感，愿意慢慢攒，也不太喜欢大起大落。优势是能守住日常成果；短板是有时过于谨慎，可能错过提升技能或尝试新收入的机会。后续财运偏稳，关键在于让努力逐渐带来更高价值。每月挑一个小目标，把固定储蓄和学习时间都先安排进去。','增收建议：选一项能提升工作价值的技能，每周投入一小时。'],
['风口捕手型','风口嗅觉','你对新机会敏感，敢于迈出第一步，赚钱思路也比较灵活。优势是反应快、点子多；短板是容易被热闹带节奏，尝试很多却未必沉淀成果。接下来适合减少同时开着的项目，把一个方向做扎实。遇到机会先写下成本、时间和最小试做方案，再开始行动。','理财建议：每次尝试先设投入上限，完成小测试再扩大。'],
['人间清醒型','账本脑','你擅长比较、计划和发现更合适的选择，日常资源利用率不错。优势是能避免不少浪费；短板是反复权衡太久，可能把时间花在小优惠上，却忽略更大的增收空间。后续财运取决于把细致用在重要决策上。每月选一件最值得优化的事，给自己设个决定期限。','增收建议：把省下来的时间投到一项能提高收入的行动里。'],
['技能变现型','硬实力','你更相信能力和持续积累，愿意用专业、经验或服务换取收入。优势是基础扎实、成长可延续；短板是容易埋头做事，不太主动展示价值。接下来适合把做过的成果整理出来，争取更好的任务和报价。每周记录一件可量化的工作成果，沟通时拿事实说话。','增收建议：整理三项成果，约一次关于职责或报酬的沟通。'],
['稳健派型','风险边界','你做决定前习惯先观察，把风险和细节想清楚，不容易一时冲动。优势是稳健、有边界；短板是可能一直等更确定的时机，迟迟没有行动。接下来可以用小规模尝试代替空想，让经验帮助判断。挑一个可承受的小项目，限定时间和预算，结束后认真复盘。','增收建议：把大计划缩成一个两周内能完成的小实验。'],
['资源整合者','人脉资源','你善于沟通，也能从合作和信息交换中发现机会。优势是容易连接资源、促成事情；短板是有时太顾及关系，职责和回报没有说清。后续财运适合通过靠谱合作逐步拓展。开始项目前先谈好分工、时间和结算方式，并把共识写下来，合作更轻松。','理财建议：合作前明确分工、成本、收益和退出办法。'],
['长期主义者','长期复利','你习惯为未来做安排，能把储蓄、开支和增收目标放在一起考虑。优势是方向感强，遇到变化也能调整；短板是计划设得太满，执行时容易有压力。接下来适合给计划留弹性，用稳定的小步积累成果。每月复盘一次，只保留最重要的两个财务目标。','增收建议：定一个本月可衡量的小目标，月底复盘再调整。']
];
let idx=0,ans=Array(16).fill(null);function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}function start(){idx=0;show('quiz');render()}function render(){let q=Q[idx];document.getElementById('count').textContent=`第 ${idx+1} / 16 题`;document.getElementById('pct').textContent=`${Math.round((idx+1)/16*100)}%`;document.getElementById('fill').style.width=`${(idx+1)/16*100}%`;document.getElementById('qnum').textContent=`QUESTION ${String(idx+1).padStart(2,'0')}`;document.getElementById('question').textContent=q[0];document.getElementById('options').innerHTML=q[1].map((x,i)=>`<button class="option ${ans[idx]===i?'selected':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${x}</span></button>`).join('');document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===15?'查看我的结果 →':'下一题 →';document.getElementById('next').disabled=ans[idx]===null}function choose(i){ans[idx]=i;render();if(idx<15)setTimeout(()=>move(1),220);else setTimeout(result,220)}function move(d){if(d===1&&ans[idx]===null)return;if(idx===15&&d===1){result();return}idx=Math.max(0,Math.min(15,idx+d));render()}function result(){let score=ans.reduce((s,x)=>s+x+1,0),r=R[Math.min(7,Math.floor((score-16)/6))];document.getElementById('name').textContent=r[0];document.getElementById('tag').textContent=`✦ ${r[1]}意象 · ${score} 分 ✦`;document.getElementById('desc').textContent=r[2];document.getElementById('advice').textContent=r[3];show('result')}function restart(){ans=Array(16).fill(null);idx=0;show('cover')}async function share(){let text=`我测了测自己的财运习惯，结果是「${document.getElementById('name').textContent}」！你也来看看～`;try{if(navigator.share)await navigator.share({title:'测一测你的财运到底怎么样',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);toast()}}catch(e){if(e.name!=='AbortError')toast()}}function toast(){let t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
</script></body></html>
